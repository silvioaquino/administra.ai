  <script type="text/markdown" id="report-md"># Relatório de Dependências entre Páginas — SeurGerente.ai

> Análise estática do `src/` (Next.js App Router) para suportar a divisão do projeto em módulos independentes.
> Gerado em 2026-07-19. Base: `madge` (grafo de importações) + leitura de navegação (`Link`/`router.push`) + chamadas de API (`fetch("/api/...")`).

---

## 1. Resumo Executivo

- **37 páginas** (`page.tsx`) e **91 rotas de API** (`route.ts`) no `src/`.
- **Nenhuma página importa outra página.** O acoplamento entre telas ocorre em uma camada saudável: **serviços/hooks de domínio e rotas de API**, não em imports diretos de componentes de página. Isso é ótimo para modularização.
- A navegação entre telas é **centralizada no `(dashboard)/layout.tsx`** (sidebar inline). Isso concentra o "grafo de navegação" num único ponto (bom e ruim — ver Riscos).
- **Camada "Core" universal:** `components/ui/*` (shadcn) + `lib/utils` (`cn`) + `lib/prisma` + `AuthProvider` (SessionProvider) são usados por quase todas as páginas. Esta é a fronteira de baixo acoplamento que todo módulo atravessa.
- **Dependência circular de MÓDULO (a único ponto crítico):** `NFe ⇄ Financeiro`. O NFe grava lançamentos no `/api/livro-diario` (7 ocorrências em 4 páginas) e o Financeiro (`fluxo-caixa`, `livro-diario`) consome `/api/produtos` (catálogo do NFe). Não é um ciclo de código, mas um ciclo lógico entre módulos.
- **Hubs de backend mais referenciados:** `/api/livro-diario` (Financeiro+NFe), `/api/produtos` (NFe+Fichas), `/api/planejamento/indicadores-resumo` (Planejamento+Fichas+Dashboard).
- **Código legado/duplicado encontrado:** `components/layout/Sidebar.tsx` **não é importado por nada** (sidebar morto, com rotas que não existem: `/notas-processadas`, `/configuracoes`). O `(dashboard)/layout.tsx` também referencia `/config/integracoes`, que **não tem página** (link quebrado).

---

## 2. Metodologia e Ferramentas

1. **`madge` 8.0.0** — gerou o grafo completo de importações de `src/` (264 arquivos) resolvendo o alias `@/` via `tsconfig.json`. Saída: `madge-graph.json`.
2. **Scripts de processamento** (`scripts/analyze-deps.mjs`, `scripts/module-coupling.mjs`, `scripts/gen-mermaid.mjs`) classificaram os imports por tipo (ui/layout/provider/hook/service/lib/component), calcularam módulos compartilhados, uso de APIs por página, ciclos e acoplamento módulo→módulo.
3. **Detecção de navegação** — `Link href` e `router.push/replace` lidas diretamente do código das páginas e do layout.
4. **Imagem visual (`--image graph.png`):** **não gerada** — o Graphviz (`dot`/`gvpr`) não está instalado no ambiente. Foi gerado o arquivo `graph.dot` (fonte DOT, escopo **páginas + módulos de domínio**, 37+44 nós) que você pode renderizar com `dot -Tpng graph.dot -o graph.png` após instalar o Graphviz. Os diagramas curados para modularização estão em **Mermaid** abaixo (`module-flow.mmd`, `page-flow.mmd`).

> Observação: o grafo completo do `madge` tem 264 nós (inclui os 91 routes de API, testes e libs). Para separar módulos, o que importa é o recorte por **domínio**, não o grafo cru — por isso os diagramas abaixo são curados.

## 6. Camada "Core" (compartilhada por quase tudo)

Estes são os nós de maior grau — o que define a fronteira de baixo acoplamento que **todo** módulo atravessa. Tratá-los como um pacote `@core` independente é o primeiro passo.

| Módulo Core | Importado por | Tipo |
|---|---|---|
| `components/ui/button.tsx` | **35/37** páginas | ui (shadcn) |
| `components/ui/input.tsx` | 27 | ui |
| `components/ui/alert.tsx` | 26 | ui |
| `lib/utils.ts` (`cn`) | 24 | lib (core) |
| `components/ui/label.tsx` | 22 | ui |
| `components/ui/card.tsx` | 20 | ui |
| `components/ui/badge.tsx` | 11 | ui |
| `lib/prisma.ts` / `lib/prisma-admin.ts` | todas as rotas de API | lib (core) |
| `components/providers/AuthProvider.tsx` (SessionProvider) | todas as páginas (root layout) | provider (core) |

> **Conclusão:** o `ui/*` + `lib/utils` + `AuthProvider` + `prisma` formam o **Core estável**. Eles NÃO devem conter lógica de domínio — manter só primitivos de apresentação e acesso a dados.

## 7. Acoplamento Módulo → Módulo (domínio)

`A → B (n)` = páginas do módulo A consomem domínio próprio do módulo B em `n` pontos (imports + chamadas de API).

| De (A) | Para (B) | Peso | Via (exemplos) |
|---|---|---|---|
| **NFe** | **Financeiro** | **7** | `/api/livro-diario` (nfe, xml, compra, lancamento) |
| **FichasTecnicas** | **Planejamento** | 3 | `/api/planejamento/indicadores-resumo`, `lucro-desejado` |
| **NFe** | **Financeiro** (hook) | 3 | `hooks/useContasFinanceiras` em nfe/compra, lancamento, xml |
| **Financeiro** | **NFe** | 3 | `/api/produtos` (normalização) em fluxo-caixa, livro-diario |
| **FichasTecnicas** | **NFe** | 2 | `/api/produtos?limit=500` em fichas/nova, /*/edit |
| **DashboardHome** | **Planejamento** | 2 | `/api/planejamento/{indicadores-resumo,metas}` |
| **Auth** | **Admin/Config** | 3 | `/api/auth/*`, `/api/empresa` |
| **Financeiro** | **Planejamento** | 1 | `/api/planejamento/folha-pagamento-config/funcionarios` |
| **DashboardHome** | **NFe** | 1 | `/api/produtos` |
| **DashboardHome** | **FichasTecnicas** | 1 | `/api/fichas-tecnicas` |

**Bidirectional / ciclo:** `NFe ⇄ Financeiro` (7 + 3). É o único ciclo de módulo do sistema.

Estas rotas são consumidas por páginas de **módulos diferentes** — são os pontos de acoplamento reais entre times/módulos.

| API | Módulos que a usam | Páginas |

| `/api/livro-diario` | **Financeiro + NFe** | 4 (livro-diario, nfe, nfe/xml, nfe/compra, nfe/lancamento) |
| `/api/produtos` | **FichasTecnicas + NFe + Dashboard** | 3+ |

## 9. Componentes/Hooks de Domínio Compartilhados (>=2 páginas)

Além do Core, estes módulos de domínio são reutilizados — sinal de onde estão as fronteiras naturais:

| Módulo compartilhado | Páginas | Pertence a |
|---|---|---|
| `hooks/useContasFinanceiras.ts` | nfe/compra, nfe/lancamento, nfe/xml | **Financeiro** (usado pelo **NFe**) |
| `components/fichas-tecnicas/CostBreakdown.tsx` | fichas-tecnicas/nova, /*/edit | FichasTecnicas |
| `components/fichas-tecnicas/UnitQuantityInput.tsx` | fichas-tecnicas/nova, /*/edit | FichasTecnicas |
| `lib/services/conversion.service.ts` | fichas-tecnicas/nova, /*/edit | FichasTecnicas |
| `types/ficha-tecnica.ts` | fichas-tecnicas/nova, /*/edit | FichasTecnicas |
| `components/camera-scanner.tsx` | nfe/compra, nfe/xml | NFe |

> **Achado de fronteira:** `useContasFinanceiras` é um hook do domínio **Financeiro** sendo importado por 3 páginas do **NFe**. Isso é um vazamento de fronteira — o NFe deveria consumir o saldo/conta via API, não importar o hook de estado do Financeiro.

## 11. Sugestão de Separação em Módulos

Princípio: **alta coesão intra-módulo, baixo acoplamento inter-módulo, mínimo de dependências fora do Core.** O projeto já está 90% pronto para isso — o corte natural é o prefixo de rota sob `(dashboard)/`.

### 11.1 Pacote `@core` (foundation, sem lógica de domínio)
- `components/ui/*`, `lib/utils`, `lib/prisma`, `lib/prisma-admin`, `components/providers/AuthProvider`, `lib/auth`, `types/*` base.
- Todos os módulos dependem dele; ele não depende de nenhum módulo de domínio.

### 11.2 Módulos de domínio (cada um com suas páginas + componentes + hooks + services + rotas de API)

| Módulo | Páginas | Componentes próprios | Hooks/Services próprios | Rotas de API próprias |
|---|---|---|---|---|
| **@app/auth** | auth/* | — | — | `/api/auth/*` |
| **@app/nfe** | nfe/* | `camera-scanner`, `produtos/*` | `useCategorias` | `/api/nfe/*`, `/api/produtos/*` |
| **@app/fichas** | fichas-tecnicas/* | `fichas-tecnicas/*` | `conversion.service`, `recipe-cost.service`, `types/ficha-tecnica` | `/api/fichas-tecnicas/*` |
| **@app/planejamento** | planejamento*, planejamento-financeiro* | — | `lib/planejamento/*`, `lib/folha*`, `lib/calculoDespesasVariaveis` | `/api/planejamento*`, `/api/planejamento-financeiro*` |
| **@app/financeiro** | caixa, contas-bancarias*, fluxo-caixa*, livro-diario, fechamento-mensal* | — | `useContasFinanceiras`, `lib/dre*`, `lib/folha-lancamentos` | `/api/caixa`, `/api/contas-financeiras`, `/api/fluxo-caixa`, `/api/livro-diario`, `/api/fechamento-mensal`, `/api/dre`, `/api/boletos`, `/api/retiradas`, `/api/vendas`, `/api/notas` |
| **@app/admin** | admin, config/* | — | `lib/admin`, `lib/stripe`, `lib/email` | `/api/admin/*`, `/api/config/*`, `/api/empresa` |
| **@app/dashboard** | (dashboard)/page | `produtividade-chart` | `useOnboarding` | `/api/dashboard*` |

### 11.3 Fronteiras e violações a corrigir (boundary violations)

| Violação | Atual | Recomendado |
|---|---|---|
| `useContasFinanceiras` (Financeiro) importado por NFe | NFe acopla estado do Financeiro | NFe consome saldo/conta via `/api/contas-financeiras` (já existe) em vez de importar o hook |
| NFe escreve em `/api/livro-diario` | Acoplamento NFe→Financeiro | Manter, mas tratar `livro-diario` como **evento/contrato estável** (versão na rota) — NFe só posta lançamentos padronizados |
| Fichas consomem `/api/produtos` e `/api/planejamento/indicadores-resumo` | Fichas depende de NFe e Planejamento | OK como dependência de *serviço* (API), desde que essas APIs sejam estáveis; **não** importar código de NFe/Planejamento |
| Dashboard consome 3 módulos | Dashboard vira hub | Aceitável — Dashboard é orquestrador de leitura; manter só leitura (GET) |

## 12. Riscos Identificados

| # | Risco | Severidade | Detalhe |
|---|---|---|---|
| R1 | **Ciclo de módulo NFe ⇄ Financeiro** | 🔴 Alta | NFe grava em `/api/livro-diario` (7 pts) e Financeiro lê `/api/produtos`. Mudança no contrato de uma API quebra a outra. É o acoplamento mais crítico. |
| R2 | **`/api/livro-diario` como hub central** | 🔴 Alta | 4+ páginas de 2 módulos dependem dela. Refatorar o Livro Diário impacta NFe e Financeiro simultaneamente. |
| R3 | **Sidebar centralizada no `(dashboard)/layout.tsx`** | 🟡 Média | Todo o grafo de navegação vive num arquivo de 400 linhas. Separar módulos exige um sistema de registro de rotas (cada módulo declara seus itens de menu) em vez de lista hardcoded. |
| R4 | **Código legado/duplicado** | 🟡 Média | `components/layout/Sidebar.tsx` **morto** (não importado; rotas `/notas-processadas`, `/configuracoes` inexistentes). `config/integracoes` no menu **não tem página** (link quebrado). |
| R5 | **`/api/produtos` compartilhado (catálogo)** | 🟡 Média | NFe, Fichas e Dashboard dependem. Mudanças de schema de produto afetam 3 módulos. |
| R6 | **`types/ficha-tecnica.ts` partilhado só dentro de Fichas** | 🟢 Baixa | Coesão boa; só confirmar que não vaze para outros módulos. |
| R7 | **Sem testes de contrato de API** | 🟡 Média | Como o acoplamento é via API (não tipo), uma mudança de payload quebra o consumidor em runtime sem erro de compilação. |

---

## 13. Plano de Desacoplamento (passos concretos)

1. **Extrair `@core`** — mover `components/ui`, `lib/utils`, `lib/prisma`, `AuthProvider`, `lib/auth`, `types` para um pacote/barrel interno. Garantir que nada de domínio mora lá.
2. **Criar barril de módulo** (`features/<mod>/index.ts`) exportando só a superfície pública (páginas, componentes, hooks, services). Importar módulos sempre via barril, nunca por caminho interno.
3. **Quebrar o ciclo NFe ⇄ Financeiro (R1/R2):**
   - Definir um **contrato de lançamento** estável (ex.: `LancamentoDTO`) em `@core/types`.
   - NFe posta lançamentos via esse contrato; Financeiro (`livro-diario`) o consome. Versar a rota se mudar o shape.
   - NFe deixa de importar `useContasFinanceiras` (R da §9) — passa a buscar saldo via `/api/contas-financeiras`.
4. **Descentralizar a navegação (R3/R4):** cada módulo exporta seus itens de menu; o layout monta o sidebar a partir do registro. Remover `Sidebar.tsx` legado e o link `config/integracoes` quebrado.
5. **Estabilizar APIs-hub (R2/R5):** tratar `/api/livro-diario`, `/api/produtos`, `/api/planejamento/indicadores-resumo` como contratos públicos versionados; adicionar testes de contrato (R7).
6. **Testes de fronteira:** um teste automatizado que falha se uma página de módulo X importar código interno de módulo Y (exceto `@core`). Reutilizar `madge` com `--circular` + um lint de imports.

    const mdText = document.getElementById('report-md').textContent;
    const el = document.getElementById('content');

    // Fallback offline: se o CDN não carregar, mostra o markdown cru em <pre>.
    if (typeof marked === 'undefined' || typeof mermaid === 'undefined') {
      const warn = document.createElement('div');
      warn.style.cssText = 'background:#3b0d0d;border:1px solid #de4838;color:#fca5a5;padding:10px 14px;border-radius:8px;margin-bottom:16px';
      warn.textContent = 'Aviso: não foi possível carregar as bibliotecas (marked/mermaid) via CDN. Verifique sua conexão com a internet. O texto do relatório aparece abaixo em formato bruto.';
      el.appendChild(warn);
      const pre = document.createElement('pre');
      pre.textContent = mdText;
      el.appendChild(pre);
    } else {
      // 1) markdown -> html
      const html = marked.parse(mdText, { gfm: true, breaks: false });
      el.innerHTML = html;

      // 2) transformar blocos mermaid (pre>code.language-mermaid) em div.mermaid
      el.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
        const pre = code.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        pre.replaceWith(div);
      });

      // 3) renderizar mermaid
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
      mermaid.run();
    }
